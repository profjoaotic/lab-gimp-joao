<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Aprende a editar imagens com o GIMP: teoria, laboratórios interativos e aplicações diretas.">
<title>LabDigital do Prof. João</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#eef1f5;--surface:#ffffff;--ink:#1c2130;--muted:#566073;--line:#d6dce5;--soft:#e6ecfb;
 --accent:#2d56c8;--accent-hover:#2246a6;--on-accent:#ffffff;--ok:#1b7646;--warn:#a1450a;
 --ui:#2a2e37;--ui-2:#333844;--ui-3:#464c5a;--ui-text:#e6e8ed;--ui-muted:#a9b0bd;--ui-accent:#8aa6ff;
 --ck1:#c7cbd3;--ck2:#e9ebef;
 --display:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
 --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;
 color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){--paper:#15181f;--surface:#1e222b;--ink:#e7e9ef;--muted:#a3aab8;--line:#323846;--soft:#232c45;--accent:#86a2ff;--accent-hover:#a3b9ff;--on-accent:#111628;--ok:#5fd394;--warn:#ffa45c;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#15181f;--surface:#1e222b;--ink:#e7e9ef;--muted:#a3aab8;--line:#323846;--soft:#232c45;--accent:#86a2ff;--accent-hover:#a3b9ff;--on-accent:#111628;--ok:#5fd394;--warn:#ffa45c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-y:scroll;scrollbar-gutter:stable}
/* Barra de deslocamento sempre visível (o Teams/Edge esconde-a por defeito) */
html::-webkit-scrollbar{width:14px}
html::-webkit-scrollbar-track{background:var(--paper)}
html::-webkit-scrollbar-thumb{background:#9aa3b2;border-radius:8px;border:3px solid var(--paper)}
html::-webkit-scrollbar-thumb:hover{background:#6f7888}
.rgb-panel,.layers,.toolstrip,.mock{user-select:none;-webkit-user-select:none}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.04rem/1.6 var(--body)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);line-height:1.12;letter-spacing:-.02em}
h2{font-size:1.55rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
kbd{font:700 .82em/1 var(--body);background:var(--soft);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:.18em .45em;white-space:nowrap}
.checker{background-color:var(--ck2);background-image:conic-gradient(var(--ck1) 25%,transparent 0 50%,var(--ck1) 0 75%,transparent 0);background-size:16px 16px}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1200px;margin:auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:800 1.08rem var(--display)}
.brand-mark{width:30px;height:30px;position:relative;border-radius:8px;background:#1b1e26;overflow:hidden}
.brand-mark i{position:absolute;width:15px;height:15px;border-radius:50%;mix-blend-mode:screen}
.brand-mark i:nth-child(1){background:#ff2a2a;left:4px;top:5px}.brand-mark i:nth-child(2){background:#22ff4a;left:11px;top:5px}.brand-mark i:nth-child(3){background:#2a5bff;left:7.5px;top:11px}
.top .tag{color:var(--muted);font-size:.88rem}

.wrap{max-width:1200px;margin:auto;padding:28px 24px 64px}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4.5vw,56px)}
.hero h1{font-size:clamp(2.5rem,6.2vw,4.6rem);font-weight:800;letter-spacing:-.035em;line-height:.98}
.hero .sub{margin-top:14px;font:700 1.15rem var(--display);color:var(--muted)}
.hero .intro{margin-top:14px;max-width:34em;font-size:1.08rem}
.hero .actions{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px}
.rgb{display:grid;grid-template-columns:minmax(0,1fr) 172px;background:var(--ui);color:var(--ui-text);border-radius:14px;overflow:hidden;box-shadow:0 18px 40px -24px #0b1020}
.rgb-stage{position:relative;aspect-ratio:1/1;background:#14161c;isolation:isolate}
.rgb-stage span{position:absolute;width:52%;aspect-ratio:1;border-radius:50%;mix-blend-mode:screen;transition:opacity .25s}
.rgb-stage span.off{opacity:0}
.rgb-stage .r{background:#ff0000;left:10%;top:12%}.rgb-stage .g{background:#00ff00;left:38%;top:12%}.rgb-stage .b{background:#0000ff;left:24%;top:38%}
.rgb-panel{padding:10px;border-left:1px solid #1c1f26;display:flex;flex-direction:column;gap:4px;font-size:.86rem}
.rgb-panel p{color:var(--ui-muted);font-size:.78rem;margin:0 2px 6px}
.rgb-panel .note{margin-top:auto;font-size:.76rem;line-height:1.4}

/* Home */
.home-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 14px}
.home-title span{color:var(--muted);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;color:var(--ink);text-decoration:none}
.card:hover{border-color:var(--accent)}
.card .n{grid-row:span 2;font:800 2.1rem/1 var(--display);color:var(--accent);min-width:1.4em}
.card h3{margin-top:2px}
.card p{color:var(--muted);font-size:.94rem}

/* Chapter */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:26px;align-items:start}
.side{position:sticky;top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.side a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:.92rem;line-height:1.3}
.side a:hover,.side a[aria-current]{background:var(--soft)}
.side a span{font:800 .85rem var(--display);color:var(--accent);min-width:1.2em}
.side .home-link{font-weight:700;margin-bottom:4px}
.chapter-head{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.chapter-no{color:var(--muted);font-size:.92rem}
.chapter-head h1{font-size:clamp(1.9rem,4vw,2.9rem);font-weight:800;margin:4px 0 6px}
.subtle{color:var(--muted)}
.toc{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.toc button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:.86rem}
.toc button:hover{border-color:var(--accent)}
.topic,.practice,.challenge{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:14px;scroll-margin-top:16px}
.topic>p{margin-top:8px;max-width:46em}
.path{display:inline-block;margin-top:10px;font-size:.9rem;background:var(--soft);border-radius:8px;padding:4px 10px}
.reference{margin-top:12px}
.theory-note{padding:9px 12px;background:var(--soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-size:.95rem;max-width:46em}
.theory-table{overflow-x:auto;margin-top:10px}
.theory-table table{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.theory-table th,.theory-table td{text-align:left;vertical-align:top;padding:7px 11px;border-bottom:1px solid var(--line)}
.theory-table th{background:var(--soft);font-weight:700}
.theory-table tr:last-child td{border-bottom:0}

/* Buttons */
.btn{display:inline-block;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:700;font-size:.94rem;text-decoration:none;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}

/* Lab (GIMP-like dark window) */
.lab{margin-top:16px;background:var(--ui);color:var(--ui-text);border-radius:12px;overflow:hidden;border:1px solid #1b1e25}
.lab:focus-visible{outline:3px solid var(--ui-accent);outline-offset:2px}
.lab-bar{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 12px;background:#20232b;font-size:.82rem;color:var(--ui-muted)}
.lab-bar b{color:var(--ui-text);font-weight:700}
.lab-main{display:grid;grid-template-columns:minmax(0,1fr) 236px}
.lab-main.solo{grid-template-columns:minmax(0,1fr)}
.stage{padding:12px;display:flex;align-items:flex-start;justify-content:center;min-width:0;overflow:auto;background:#3a3f4b}
.panel{padding:12px;background:var(--ui-2);border-left:1px solid #1f2229;display:flex;flex-direction:column;gap:10px;font-size:.88rem;min-width:0}
.panel h4{margin:0;font:700 .8rem var(--body);color:var(--ui-muted)}
.panel label{display:grid;gap:3px}
.panel .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ui-btn{border:1px solid #1d2027;background:var(--ui-3);color:var(--ui-text);border-radius:7px;padding:5px 9px;font-size:.84rem;line-height:1.25}
.ui-btn:hover{background:#525969}
.ui-btn[aria-pressed="true"]{background:#3d5bb8;border-color:#7d9bff}
.ui-btn.go{background:#3d5bb8;border-color:#5f7fe0}
.ui-btn:disabled{opacity:.45;cursor:default}
.lab input[type=range]{width:100%;accent-color:var(--ui-accent)}
.lab input[type=number],.lab input[type=text],.lab select{background:#1f2229;border:1px solid #4a5160;border-radius:6px;padding:4px 7px;color:var(--ui-text);width:100%;min-width:0}
.lab-status{margin:0;padding:9px 12px;background:#20232b;border-top:1px solid #1a1c22;font-size:.9rem;min-height:2.6em;color:var(--ui-text)}
.lab-status.good{color:#8ef0b8}.lab-status.bad{color:#ffc08a}
.view{display:block;width:100%;height:auto;max-width:560px;touch-action:none;box-shadow:0 0 0 1px #1a1c22}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.stack{position:relative;width:100%;max-width:560px}
.stack canvas+canvas{position:absolute;inset:0;pointer-events:none;box-shadow:none}
.toolstrip{display:flex;flex-wrap:wrap;gap:4px}
.tool{width:38px;height:38px;display:grid;place-items:center;border:1px solid transparent;background:transparent;color:var(--ui-text);border-radius:7px;padding:0}
.tool:hover{background:var(--ui-3)}
.tool[aria-pressed="true"]{background:#3d5bb8;border-color:#7d9bff}
.tool svg{width:22px;height:22px}
.tool.flash{animation:flash .6s}
@keyframes flash{0%{background:#ffd23f;color:#1c2130}100%{background:transparent}}
.colors{position:relative;width:62px;height:52px}
.colors input[type=color]{position:absolute;width:36px;height:30px;padding:0;border:2px solid #111;border-radius:3px;background:none;cursor:pointer}
.colors .fg{left:0;top:0;z-index:2}.colors .bg{left:20px;top:18px}
.colors input::-webkit-color-swatch-wrapper{padding:0}.colors input::-webkit-color-swatch{border:0}
.colors input::-moz-color-swatch{border:0}
.hist{list-style:none;margin:0;padding:0;max-height:180px;overflow:auto;background:#1f2229;border-radius:6px}
.hist button{width:100%;text-align:left;border:0;background:none;padding:4px 8px;font-size:.84rem;color:var(--ui-text)}
.hist button.cur{background:#3d5bb8}
.hist button.future{color:#7d8494}
.layers{list-style:none;margin:0;padding:0;background:#1f2229;border-radius:6px;overflow:hidden}
.layers li{display:flex;align-items:center;gap:7px;padding:4px 6px;border-bottom:1px solid #2a2e37;cursor:pointer}
.layers li.on{background:#3d5bb8}
.layers li canvas{width:40px;height:27px;border:1px solid #111;flex:none}
.layers li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layers li .nm.bold{font-weight:700}
.eye{width:26px;height:26px;display:grid;place-items:center;border:0;background:none;color:var(--ui-text);padding:0;border-radius:5px;flex:none}
.eye[aria-pressed="false"] svg{opacity:.2}
.eye svg{width:18px;height:18px}
.rgb-panel .layers li{background:transparent}
.swatch{height:84px;border-radius:8px;border:1px solid #111}
.hex{font:700 1.15rem var(--display);letter-spacing:.02em}
.props{width:100%;border-collapse:collapse;font-size:.84rem}
.props td{padding:4px 2px;border-bottom:1px solid #444a57;vertical-align:top}
.props td:last-child{text-align:right;font-weight:700}
.bar{height:10px;background:#1f2229;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ui-accent);transition:width .25s}

/* Interface mock */
.mock{display:grid;grid-template-columns:118px minmax(0,1fr) 128px;grid-template-rows:auto 1fr auto auto;gap:3px;background:#1a1c22;padding:3px;border-radius:6px;width:100%;max-width:640px;font-size:.72rem;user-select:none}
.zone{background:var(--ui-2);border:2px solid transparent;border-radius:4px;padding:5px;cursor:pointer;color:var(--ui-muted);min-width:0}
.zone:hover{border-color:#6f8cff}
.zone.found{border-color:#56d48e}
.zone.wrong{border-color:#ff9a4d}
.z-menu{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--ui-text)}
.z-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;align-content:start}
.z-tools i{aspect-ratio:1;background:#4a5060;border-radius:3px}
.z-tools i.fgbg{grid-column:span 2;background:linear-gradient(135deg,#000 50%,#fff 50%);border:1px solid #111}
.z-options{grid-column:1}
.z-options div{height:9px;background:#4a5060;border-radius:3px;margin-top:6px}
.z-canvas{grid-row:2/4;grid-column:2;display:grid;place-items:center;background:#3a3f4b;padding:10px}
.z-canvas canvas{width:100%;max-width:300px;height:auto;pointer-events:none}
.z-layers{grid-row:2/4;grid-column:3}
.z-layers div{display:flex;gap:4px;align-items:center;margin-top:5px}
.z-layers div i{width:22px;height:15px;background:#5b6272;border:1px solid #111;flex:none}
.z-status{grid-column:1/-1;color:var(--ui-muted)}
.mission{font:700 1rem var(--display);color:#fff}

/* Practice */
.practice-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.quiz{border-top:1px solid var(--line);padding:16px 0 4px;margin-top:12px}
.quiz fieldset{border:0;padding:0;margin:8px 0;min-width:0}
.quiz legend{font-weight:700;margin-bottom:6px;max-width:44em}
.choices{display:flex;flex-wrap:wrap;gap:7px}
.choices label{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer}
.choices label:has(:checked){background:var(--soft);border-color:var(--accent)}
.feedback{margin-top:8px;font-size:.95rem}
.feedback.ok{color:var(--ok)}.feedback.retry{color:var(--warn)}
.challenge ol{margin:10px 0 0;padding-left:1.4em;max-width:46em}
.challenge li{margin:6px 0}
.chapter-nav{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
.mobile-nav{display:none}
footer{padding:20px 24px;text-align:center;color:var(--muted);font-size:.86rem;border-top:1px solid var(--line)}

@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.rgb{max-width:520px}}
@media(max-width:860px){.lab-main{grid-template-columns:minmax(0,1fr)}.panel{border-left:0;border-top:1px solid #1f2229}}
@media(max-width:760px){
 .wrap{padding:16px 12px 40px}.top-inner{padding:10px 14px}.top .tag{display:none}
 .layout{display:block}.side{display:none}
 .mobile-nav{display:block;width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:var(--surface);color:var(--ink)}
 .grid{grid-template-columns:1fr}
 .chapter-head,.topic,.practice,.challenge{padding:16px}
 .mock{grid-template-columns:84px minmax(0,1fr) 92px;font-size:.62rem}
 .rgb{grid-template-columns:minmax(0,1fr) 140px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
 <a class="brand" href="#inicio"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>LabDigital do Prof. João</a>
 <span class="tag">TIC: edição de imagem com o GIMP</span>
</div></header>
<main id="app" class="wrap"></main>
<footer>LabDigital do Prof. João. Os nomes dos menus seguem o GIMP 3 em português e podem variar ligeiramente de versão para versão.</footer>

<script>
/* ===================== CONTEÚDO ===================== */
const chapters=[
{title:"Conhecer o GIMP",desc:"A janela, as ferramentas, desfazer e guardar.",
 topics:[
  {title:"A janela do GIMP",theory:"O GIMP é um programa gratuito para editar imagens: retocar fotografias, fazer montagens, criar cartazes e desenhar. Funciona em Windows, macOS e Linux. Quando o abres, encontras cinco zonas principais. Cumpre as missões para as descobrires.",lab:"interface",
   ref:{headers:["Zona","Para que serve"],rows:[["Barra de menus","Todos os comandos: Ficheiro, Imagem, Cores, Filtros…"],["Caixa de ferramentas","Seleções, pintura, texto, transformações."],["Opções da ferramenta","Definições da ferramenta escolhida, como o tamanho."],["Janela da imagem","A imagem que estás a editar."],["Painel Camadas","As camadas da imagem, de cima para baixo."]],code:[],note:"Se os painéis desaparecerem, carrega em Tab: esta tecla esconde e volta a mostrar os painéis."}},
  {title:"Escolher ferramentas com o teclado",theory:"Cada ferramenta tem uma tecla de atalho. Carregar na tecla é mais rápido do que procurar o ícone. Na caixa de ferramentas, algumas ferramentas estão agrupadas num só ícone; abre o grupo para veres as outras. Clica no laboratório e carrega nas teclas pedidas.",lab:"shortcuts",
   ref:{headers:["Ferramenta","Atalho"],rows:[["Seleção retangular / elíptica","R / E"],["Seleção livre / difusa","F / U"],["Recortar / Escalar","Shift+C / Shift+S"],["Mover / Texto","M / T"],["Pincel / Lápis / Borracha","P / N / Shift+E"],["Balde de tinta / Gradiente","Shift+B / G"]],code:[1]}},
  {title:"Desfazer e refazer",theory:"Enganaste-te? Ctrl+Z desfaz o último passo e Ctrl+Y refaz. O painel Histórico de desfazer (Editar > Histórico de desfazer) mostra todos os passos: clica num deles para voltar a esse momento. Pinta alguns traços e experimenta.",lab:"paint",cfg:{tools:["brush"],base:"scene",history:true,fg:"#ffd23f"},
   ref:{headers:["Ação","Atalho"],rows:[["Desfazer","Ctrl+Z"],["Refazer","Ctrl+Y"]],code:[1]}},
  {title:"Guardar ou exportar",theory:"Ficheiro > Guardar cria um ficheiro .xcf, o formato do GIMP: guarda as camadas e o texto editável para continuares mais tarde. Para usar a imagem noutro sítio (Teams, um site, uma apresentação), usa Ficheiro > Exportar como e escolhe PNG ou JPEG. Compara os três formatos.",lab:"formats",
   ref:{headers:["Ação","Menu","Atalho"],rows:[["Guardar o projeto (.xcf)","Ficheiro > Guardar","Ctrl+S"],["Exportar (PNG, JPEG…)","Ficheiro > Exportar como","Shift+Ctrl+E"]],code:[2]}}
 ],
 quizzes:[
  {q:"Queres continuar o trabalho amanhã, com todas as camadas. Em que formato guardas?",options:[".xcf",".jpg",".png"],correct:0,why:"Só o .xcf guarda as camadas e o texto editável. PNG e JPEG juntam tudo numa só imagem."},
  {q:"Que tecla escolhe o Pincel?",options:["B","P","N"],correct:1,why:"P de Pincel. O N escolhe o Lápis."},
  {q:"Os painéis desapareceram todos. O que experimentas primeiro?",options:["Reinstalar o GIMP","Carregar em Tab","Fechar a imagem"],correct:1,why:"A tecla Tab esconde e volta a mostrar os painéis."}
 ],
 challenge:["Abre o GIMP e cria uma imagem nova com Ficheiro > Novo (Ctrl+N), com 800 × 600 píxeis.","Escolhe o Pincel com a tecla P e escreve o teu nome à mão.","Desfaz o último traço com Ctrl+Z e refaz com Ctrl+Y.","Guarda como nome_turma.xcf e exporta uma cópia em PNG."]
},
{title:"Píxeis, tamanho e recorte",desc:"Do que é feita uma imagem e como mudar o seu tamanho.",

const app=document.getElementById('app');

const onCleanup=f=>cleanups.push(f);
const h=(tag,opts={},...children)=>{
 const el=document.createElement(tag);
 for(const [k,v] of Object.entries(opts)){
  if(v===null||v===undefined||v===false)continue;
  if(k==='class')el.className=v;
  else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
  else el.setAttribute(k,String(v));
 }
 for(const c of children.flat(Infinity))if(c!==null&&c!==undefined&&c!==false)el.append(c);
 return el;
};

function say(el,t,kind=''){el.textContent=t;el.className='lab-status'+(kind?' '+kind:'');}
function pos(e,cv){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};}
function drag(cv,{down,move,up}){
 cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();
  cv.closest('.lab')?.focus({preventScroll:true});
  cv.setPointerCapture(e.pointerId);
  down?.(pos(e,cv),e);
  const mv=ev=>move?.(pos(ev,cv),ev);
  const u=ev=>{cv.removeEventListener('pointermove',mv);cv.removeEventListener('pointerup',u);cv.removeEventListener('pointercancel',u);up?.(pos(ev,cv),ev);};
  cv.addEventListener('pointermove',mv);cv.addEventListener('pointerup',u);cv.addEventListener('pointercancel',u);
 });
}
function combo(e){
 let k=e.key;
 if(k==='+'||k==='=')return'+';
 if(k==='-')return'-';
 if(e.code&&e.code.startsWith('Key'))k=e.code.slice(3);
 else if(e.code&&e.code.startsWith('Digit'))k=e.code.slice(5);
 else if(k.length===1)k=k.toUpperCase();
 const p=[];
 if(e.shiftKey&&!['Shift'].includes(k))p.push('Shift');
 if(e.ctrlKey||e.metaKey)p.push('Ctrl');
 return [...p,k].join('+');
}
function keys(root,handler){
 root.addEventListener('keydown',e=>{
  if(e.target.matches('input[type=text],input[type=number],textarea,select'))return;
  if(handler(combo(e),e))e.preventDefault();
 });
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hex2=v=>v.toString(16).padStart(2,'0').toUpperCase();
const toHex=(r,g,b)=>'#'+hex2(r)+hex2(g)+hex2(b);
function parseHex(s){return[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];}

function drawParts(x,parts,line=false){
 for(const p of parts){
  const [path,fill]=SHAPES[p];

function cropLab(){

/* 8. Rodar e espelhar */

 // history
 let hist=[{name:'Imagem original',d:x.getImageData(0,0,SW,SH)}],hi=0;
 const hlist=h('ul',{class:'hist'});
 function push(name){hist=hist.slice(0,hi+1);hist.push({name,d:x.getImageData(0,0,SW,SH)});if(hist.length>30)hist.shift();hi=hist.length-1;renderHist();}
 function go(i){hi=clamp(i,0,hist.length-1);x.putImageData(hist[hi].d,0,0);renderHist();}
 function renderHist(){if(!cfg.history)return;hlist.replaceChildren(...hist.map((s,i)=>h('li',{},h('button',{type:'button',class:i===hi?'cur':i>hi?'future':'',onclick:()=>{go(i);say(st,i<hist.length-1?'Voltaste ao passo «'+s.name+'». Os passos a cinzento podem ser refeitos.':'Estás no último passo.');}},s.name))));hlist.lastChild?.scrollIntoView?.({block:'nearest'});}

  h('label',{},h('span',{},'Tamanho: ',sizeOut),sizeIn),
  h('div',{class:'row'},h('button',{type:'button',class:'ui-btn',onclick:()=>{if(hi>0){go(hi-1);say(st,'Desfeito (Ctrl+Z).');}}},'Desfazer'),h('button',{type:'button',class:'ui-btn',onclick:()=>{if(hi<hist.length-1){go(hi+1);say(st,'Refeito (Ctrl+Y).');}}},'Refazer'),h('button',{type:'button',class:'ui-btn',onclick:()=>{x.clearRect(0,0,SW,SH);x.drawImage(base(),0,0);push('Repor imagem');}},'Repor')),

 const grid=h('div',{class:'grid'},chapters.map((c,i)=>h('a',{class:'card',href:hash(i)},h('span',{class:'n'},num(i)),h('h3',{},c.title),h('p',{},c.desc))));
 app.append(hero,h('div',{class:'home-title'},h('h2',{},'Capítulos'),h('span',{},chapters.length+' capítulos e '+total+' perguntas')),grid);
}
function sidebar(i){return h('nav',{class:'side','aria-label':'Capítulos'},navlink('#inicio','Índice','home-link'),chapters.map((c,j)=>h('a',{href:hash(j),...(i===j?{'aria-current':'page'}:{})},h('span',{},num(j)),c.title)));}
function reference(t){
 const r=t.ref;if(!r)return null;
 const table=r.headers?h('div',{class:'theory-table'},h('table',{'aria-label':t.title},h('thead',{},h('tr',{},r.headers.map(x=>h('th',{scope:'col'},x)))),h('tbody',{},r.rows.map(row=>h('tr',{},row.map((cell,i)=>h('td',{},r.code.includes(i)?kbdify(cell):cell))))))):null;
 return h('div',{class:'reference'},r.note?h('p',{class:'theory-note'},r.note):null,table);
}
function kbdify(s){const out=[];s.split(' / ').forEach((part,i)=>{if(i)out.push(' / ');const m=/^(.*?)( \(.*\))?$/.exec(part);out.push(h('kbd',{},m[1]));if(m[2])out.push(m[2]);});return out;}
function practice(c,i){
 const sec=h('section',{class:'practice',id:'aplicacoes'},h('div',{class:'practice-head'},h('div',{},h('h2',{},'Aplicações diretas'),h('p',{class:'subtle'},'Escolhe uma resposta e confirma.'))));
 c.quizzes.forEach((q,j)=>{
  const key=i+'-'+j;
  const fbk=h('p',{class:'feedback','aria-live':'polite'});
  const radios=q.options.map((o,k)=>{const inp=h('input',{type:'radio',name:'q'+key,value:k,required:''});if(saved[key]===k)inp.checked=true;return h('label',{},inp,o);});
  const check=k=>{fbk.className='feedback '+(k===q.correct?'ok':'retry');fbk.textContent=(k===q.correct?'Certo. ':'Ainda não. ')+q.why;};
  const form=h('form',{class:'quiz',onsubmit:e=>{e.preventDefault();const k=Number(new FormData(form).get('q'+key));saved[key]=k;check(k);}},h('fieldset',{},h('legend',{},(j+1)+'. '+q.q),h('div',{class:'choices'},radios)),h('button',{type:'submit',class:'btn primary'},'Verificar resposta'),fbk);
  if(key in saved)check(saved[key]);
  sec.append(form);
 });
 return sec;
}
function chapter(i){
 const c=chapters[i];
 const mobile=h('select',{class:'mobile-nav','aria-label':'Ir para um capítulo',onchange:e=>{location.hash=e.target.value;}},h('option',{value:'#inicio'},'Índice de capítulos'),chapters.map((x,j)=>h('option',{value:hash(j)},num(j)+'. '+x.title)));
 mobile.value=hash(i);
 const jump=id=>document.getElementById(id)?.scrollIntoView({block:'start'});
 const toc=h('nav',{class:'toc','aria-label':'Nesta página'},c.topics.map((t,j)=>h('button',{type:'button',onclick:()=>jump('topico-'+j)},t.title)),h('button',{type:'button',onclick:()=>jump('desafio')},'Desafio no GIMP'),h('button',{type:'button',onclick:()=>jump('aplicacoes')},'Aplicações diretas'));
 const topics=c.topics.map((t,j)=>{let lab=null;try{lab=t.lab?LABS[t.lab](t.cfg||{}):null;}catch(err){console.error(err);lab=h('p',{class:'theory-note'},'Não foi possível abrir este laboratório neste navegador.');}
  return h('section',{id:'topico-'+j,class:'topic'},h('h2',{},t.title),h('p',{},t.theory),t.path?h('span',{class:'path'},t.path):null,reference(t),lab);});
 const challenge=h('section',{class:'challenge',id:'desafio'},h('h2',{},'Desafio no GIMP'),h('p',{class:'subtle'},'Agora no programa a sério. Segue os passos pela ordem.'),h('ol',{},c.challenge.map(s=>h('li',{},s))));
 const last=chapters.length-1;
 const content=h('div',{},mobile,h('header',{class:'chapter-head'},h('p',{class:'chapter-no'},'Capítulo '+(i+1)+' de '+chapters.length),h('h1',{},c.title),h('p',{class:'subtle'},c.desc),toc),topics,challenge,practice(c,i),
  h('nav',{class:'chapter-nav','aria-label':'Avançar ou recuar'},i===0?navlink('#inicio','Índice'):navlink(hash(i-1),'Capítulo anterior'),i===last?navlink('#inicio','Voltar ao índice','btn primary'):navlink(hash(i+1),'Capítulo seguinte','btn primary')));
 app.append(h('div',{class:'layout'},sidebar(i),content));
}
function render(){
 cleanups.forEach(f=>{try{f();}catch{}});cleanups=[];
 app.replaceChildren();
 const m=/^#capitulo-(\d+)$/.exec(location.hash);
 const n=m?Number(m[1])-1:-1;
 if(n>=0&&n<chapters.length)chapter(n);else home();
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
render();
</script>
